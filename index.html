<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Волшебное преображение</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial,sans-serif;color:#58466c;background:linear-gradient(145deg,#ccefff,#fde2f3);min-height:100vh;display:grid;place-items:center}button{font:inherit;cursor:pointer;border:0}#game{position:relative;width:min(100%,1000px);min-height:min(92vh,680px);border-radius:25px;overflow:hidden;box-shadow:0 18px 60px #738ba25e;background:linear-gradient(#d6f2ff,#fff0da)}#game:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 15% 15%,#fff9 0 5px,transparent 7px),radial-gradient(circle at 80% 20%,#fff9 0 9px,transparent 11px);pointer-events:none}.top{position:relative;text-align:center;padding:18px 20px 4px}.top h1{margin:0;font-size:clamp(25px,4vw,43px);color:#fd78aa;text-shadow:2px 3px white,-1px -1px white}.top p{margin:8px}.steps{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:8px auto}.step{padding:6px 12px;border-radius:30px;background:#ffffff99;font-size:13px}.step.active{background:#ffd36b}.stage{position:relative;padding:12px 18px 110px;min-height:480px;display:flex;align-items:center;justify-content:center;gap:28px;flex-wrap:wrap}.panel{background:#ffffffce;border:3px solid white;border-radius:24px;padding:18px;box-shadow:0 7px 22px #94a3b345;text-align:center}.pick{width:220px;transition:transform .2s}.pick:hover{transform:translateY(-5px)}.pick h2{margin:10px}.avatar{position:relative;width:240px;height:370px;margin:auto;user-select:none;touch-action:none}.avatar.small{width:155px;height:236px;transform-origin:top center}.head{position:absolute;left:25%;top:7%;width:50%;height:32%;border:3px solid #c87d58;border-radius:45% 45% 48% 48%;background:linear-gradient(135deg,#ffdec3,#f6b58f);z-index:4}.ears:before,.ears:after{content:"";position:absolute;top:45%;height:20%;width:13%;border-radius:100%;background:#ffccaa;border:2px solid #d08b63}.ears:before{left:-11%}.ears:after{right:-11%}.eyes{position:absolute;left:18%;top:40%;width:64%;display:flex;justify-content:space-between}.eye{width:24px;height:30px;border-radius:50%;background:#fff;position:relative}.eye:after{content:"";position:absolute;left:6px;top:5px;width:14px;height:19px;border-radius:50%;background:#504071;box-shadow:inset 3px 0 #7bc7ee}.nose{position:absolute;top:64%;left:47%;width:9px;height:7px;border-radius:50%;background:#e8a081}.mouth{position:absolute;top:74%;left:42%;width:19%;height:9px;border-bottom:3px solid #cb6682;border-radius:50%}.cheek{position:absolute;top:67%;width:19%;height:12%;background:#fda7a888;border-radius:50%;filter:blur(3px)}.cheek.a{left:8%}.cheek.b{right:8%}.hair{position:absolute;left:18%;top:1%;width:64%;height:25%;z-index:5;border-radius:53% 47% 25% 25%;background:#835138;clip-path:polygon(1% 55%,12% 14%,29% 21%,48% 0,59% 16%,80% 4%,98% 28%,99% 72%,88% 53%,75% 46%,65% 69%,52% 42%,41% 66%,25% 45%,10% 81%)}.hair.girl{background:#dba452;width:75%;left:13%;height:49%;border-radius:48% 48% 38% 38%;clip-path:none;z-index:3}.hair.girl:after{content:"";position:absolute;top:0;left:9%;width:82%;height:37%;background:#eabe6d;border-radius:50% 50% 22% 22%}.hair.h1{filter:hue-rotate(-20deg)}.hair.h2{filter:hue-rotate(20deg)}.hair.h3{filter:brightness(.7)}.hair.h4{filter:brightness(1.2)}.body{position:absolute;left:25%;top:39%;width:50%;height:36%;background:#ffd6b5;border:3px solid #c88b68;border-radius:30% 30% 19% 19%;z-index:2}.arms:before,.arms:after{content:"";position:absolute;top:41%;width:16%;height:29%;border-radius:24px;background:#ffd2b0;border:3px solid #c88b68;z-index:1}.arms:before{left:14%;transform:rotate(14deg)}.arms:after{right:14%;transform:rotate(-14deg)}.legs:before,.legs:after{content:"";position:absolute;top:70%;width:21%;height:26%;background:#ffd2b0;border:3px solid #c88b68;border-radius:0 0 25px 25px;z-index:1}.legs:before{left:27%}.legs:after{right:27%}.outfit{position:absolute;top:42%;left:20%;width:60%;height:34%;z-index:3;background:#5798dd;border-radius:20% 20% 25% 25%;clip-path:polygon(20% 0,36% 0,50% 11%,64% 0,80% 0,100% 19%,86% 38%,81% 28%,85% 100%,15% 100%,19% 28%,14% 38%,0 19%)}.outfit.dress{background:#f787b5;height:46%;left:15%;width:70%;clip-path:polygon(25% 0,39% 0,50% 12%,61% 0,75% 0,99% 16%,87% 31%,76% 26%,100% 100%,0 100%,24% 26%,13% 31%,1% 16%)}.outfit.o1{background:#a58bea}.outfit.o2{background:#70c69f}.outfit.o3{background:#ffd16e}.outfit.o4{background:#6cb9e7}.dirt{position:absolute;inset:0;z-index:9;pointer-events:none}.mud{position:absolute;background:#815538;border-radius:48% 60% 40% 70%;opacity:.87}.mud:nth-child(1){top:26%;left:24%;width:28px;height:22px}.mud:nth-child(2){top:50%;left:37%;width:42px;height:28px}.mud:nth-child(3){top:61%;right:22%;width:26px;height:33px}.mud:nth-child(4){top:82%;left:31%;width:22px;height:24px}.mud:nth-child(5){top:16%;right:26%;width:18px;height:14px}.foam{position:absolute;inset:12% 17% 10%;z-index:10;pointer-events:none;background:radial-gradient(circle at 20% 23%,white 0 13px,transparent 15px),radial-gradient(circle at 70% 45%,#fff 0 19px,transparent 21px),radial-gradient(circle at 30% 71%,#fff 0 21px,transparent 23px),radial-gradient(circle at 60% 88%,#fff 0 14px,transparent 16px)}.work{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:25px}.scene{position:relative;width:330px;max-width:90vw;padding:20px 0;border-radius:36px;background:linear-gradient(#c2e9fa 65%,#f6e3d4 65%);border:8px solid #fff;box-shadow:0 10px 30px #91bbcf55}.scene:after{content:"";position:absolute;bottom:25px;left:8%;width:84%;height:16px;border-radius:50%;background:#b1c8dc77;z-index:0}.toolbox{width:285px;max-width:90vw}.toolbox h2{margin-top:0}.btn,.item{padding:12px 18px;background:#fff;border-radius:16px;box-shadow:0 4px 0 #bdc8d0;margin:5px;color:#58466c}.btn.primary{background:#83d7a9;color:#23573e;font-weight:bold}.btn.pink{background:#ffacd1}.item{display:inline-grid;place-items:center;min-width:74px;min-height:70px;font-size:29px;border:3px solid transparent}.item small{font-size:12px}.item.selected{border-color:#65bb8b;background:#e1ffea}.footer{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:12px;padding:8px;z-index:12}.status{font-size:17px;font-weight:bold;min-height:46px}.meter{height:14px;border-radius:20px;background:#d6dbe0;overflow:hidden}.meter b{display:block;height:100%;background:linear-gradient(90deg,#8dd5ed,#79d9a6);transition:width .2s}.sparkle{font-size:35px}.final{display:flex;gap:15px;flex-wrap:wrap;align-items:center;justify-content:center}.final .avatar{margin:0}@media(max-width:600px){#game{border-radius:0;min-height:100dvh}.stage{gap:12px;padding-bottom:95px}.scene{width:265px}.scene .avatar{transform:scale(.78);margin:-30px auto -65px}.toolbox{width:100%}.item{padding:6px;min-width:60px;min-height:52px}.pick{width:45%;padding:7px}.pick .avatar{transform:scale(.62);transform-origin:top center;margin-bottom:-80px}.pick h2{font-size:17px}.top{padding-top:8px}} 
</style></head><body><main id="game"><header class="top"><h1>✨ Волшебное преображение ✨</h1><p id="subtitle">Помоги героям стать чистыми, красивыми и нарядными!</p><div id="steps" class="steps"></div></header><section id="stage" class="stage"></section><footer id="footer" class="footer"></footer></main><script>
const stage=document.getElementById('stage'),footer=document.getElementById('footer'),steps=document.getElementById('steps'),subtitle=document.getElementById('subtitle');
let who=null,phase='choose',progress=0,soap=false,foam=false,hair=0,outfit=0,done={boy:null,girl:null};const names={boy:'Мальчик',girl:'Девочка'};
function avatar(person,opts={}){let dirty=opts.dirty!==false;return '<div class="avatar '+(opts.small?'small':'')+'"><div class="legs"></div><div class="arms"></div><div class="body"></div><div class="outfit '+(person==='girl'?'dress ':'')+'o'+(opts.outfit??0)+'"></div><div class="hair '+(person==='girl'?'girl ':'')+'h'+(opts.hair??0)+'"></div><div class="head"><div class="ears"></div><div class="eyes"><div class="eye"></div><div class="eye"></div></div><div class="nose"></div><div class="mouth"></div><div class="cheek a"></div><div class="cheek b"></div></div>'+(dirty?'<div class="dirt">'+Array.from({length:5},()=>'<i class="mud"></i>').join('')+'</div>':'')+(opts.foam?'<div class="foam"></div>':'')+'</div>'}
function btn(t,f,cls=''){return '<button class="btn '+cls+'" data-go="'+f+'">'+t+'</button>'}function nav(text='',act='next'){footer.innerHTML=btn('⌂ В начало','home')+(text?btn(text,act,'primary'):'')}
function show(){steps.innerHTML=['choose','wash','rinse','dry','hair','outfit','done'].map((s,i)=>'<span class="step '+(s===phase?'active':'')+'">'+['Выбор','🧽 Мыло','🚿 Душ','🧺 Полотенце','💇 Причёска','👗 Одежда','⭐ Готово'][i]+'</span>').join('');
subtitle.textContent=phase==='choose'?'Выбирай героя — каждого ждёт чудесное преображение!':phase==='done'?'Вот какой замечательный результат!':'Преображаем героя: '+names[who];
if(phase==='choose'){stage.innerHTML=['boy','girl'].map(p=>'<div class="panel pick"><div>'+avatar(p,{dirty:true,small:true})+'</div><h2>'+names[p]+'</h2>'+btn(done[p]?'Преобразить снова':'Выбрать',p,'pink')+'</div>').join('');nav();return}
if(phase==='done'){done[who]={hair,outfit};stage.innerHTML='<div class="panel"><h2>🌟 Великолепно! 🌟</h2><div class="final">'+avatar(who,{dirty:false,hair,outfit})+'</div><p>Ты отлично справился!</p>'+btn('Преобразить другого героя','other','pink')+'</div>';nav('Играть ещё раз','again');return}
let message={wash:'Натирай грязные места губкой, чтобы появилась пена!',rinse:'Проведи душем по герою и смой всю пену!',dry:'Аккуратно вытри героя полотенцем!',hair:'Выбирай красивую причёску!',outfit:'Подбери наряд для героя!'}[phase];
let options=phase==='hair'?'<div>'+[0,1,2,3,4].map(i=>'<button class="item '+(hair===i?'selected':'')+'" data-hair="'+i+'">💇<small>№ '+(i+1)+'</small></button>').join('')+'</div>':phase==='outfit'?'<div>'+[0,1,2,3,4].map(i=>'<button class="item '+(outfit===i?'selected':'')+'" data-outfit="'+i+'">'+(who==='girl'?'👗':'👕')+'<small>№ '+(i+1)+'</small></button>').join('')+'</div>':phase==='wash'?'<div class="item">🧽</div>':phase==='rinse'?'<div class="item">🚿</div>':'<div class="item">🧺</div>';
stage.innerHTML='<div class="work"><div class="scene" id="scene">'+avatar(who,{dirty:phase==='wash'&&!soap,foam:phase==='rinse'||(phase==='wash'&&soap),hair,outfit})+'</div><div class="panel toolbox"><h2>'+({wash:'1. Намыливаем',rinse:'2. Смываем пену',dry:'3. Вытираемся',hair:'4. Причёска',outfit:'5. Одежда'}[phase])+'</h2><p class="status">'+message+'</p>'+options+( ['wash','rinse','dry'].includes(phase)?'<div class="meter"><b style="width:'+progress+'%"></b></div><p>Води пальцем или мышкой по герою</p>':'')+'</div></div>';
nav(phase==='hair'||phase==='outfit'?'Дальше ➜':'', 'next');if(['wash','rinse','dry'].includes(phase))installTouch()}
function installTouch(){let el=document.getElementById('scene'),tracking=false,last=0;function move(e){if(!tracking)return;e.preventDefault();let now=Date.now();if(now-last<50)return;last=now;let r=el.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(x<r.width*.12||x>r.width*.88||y<r.height*.05||y>r.height*.95)return;progress=Math.min(100,progress+4);if(phase==='wash'&&progress>=35)soap=true;el.querySelector('.avatar').outerHTML=avatar(who,{dirty:phase==='wash'&&!soap,foam:phase==='rinse'||(phase==='wash'&&soap),hair,outfit});document.querySelector('.meter b').style.width=progress+'%';if(progress>=100){tracking=false;setTimeout(()=>{advance()},200)}}el.addEventListener('pointerdown',e=>{tracking=true;el.setPointerCapture(e.pointerId);move(e)});el.addEventListener('pointermove',move);el.addEventListener('pointerup',()=>tracking=false);el.addEventListener('pointercancel',()=>tracking=false)}
function start(p){who=p;phase='wash';progress=0;soap=false;hair=0;outfit=0;show()}function advance(){progress=0;phase=({wash:'rinse',rinse:'dry',dry:'hair',hair:'outfit',outfit:'done'})[phase]||'choose';show()}
document.addEventListener('click',e=>{let h=e.target.closest('[data-hair]'),o=e.target.closest('[data-outfit]'),b=e.target.closest('[data-go]');if(h){hair=+h.dataset.hair;show()}if(o){outfit=+o.dataset.outfit;show()}if(b){let a=b.dataset.go;if(a==='boy'||a==='girl')start(a);else if(a==='home'||a==='other'){phase='choose';show()}else if(a==='again')start(who);else if(a==='next')advance()}});show();
</script></body></html>
